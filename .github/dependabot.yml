# Weekly, grouped update PRs. Commit messages (and so PR titles) are
# Conventional Commits whose types don't trigger a release on their own:
# a dependency bump ships with the next feat/fix release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      python:
        patterns: ["*"]
