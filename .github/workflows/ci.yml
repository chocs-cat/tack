name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  changes:
    # Decides whether the checks run. The docs filter lives here, not in a
    # workflow-level paths-ignore: a skipped workflow never reports `CI
    # passed`, so a docs-only pull request would wait on it forever.
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Both sides of a rename count, so moving code into docs/ still runs.
          # docs/design.md counts as code: tests/test_config.py loads its
          # manifest example.
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)')
          if grep -qv '^docs/' <<<"$files" || grep -qx 'docs/design.md' <<<"$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint (ruff, ty)
    needs: changes
    # Anything but an explicit `false` runs it, so a failed `changes` job
    # still runs the checks instead of skipping them.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q

  package:
    # Build the sdist and wheel, then install each into a fresh environment
    # and run the installed command: catches packaging mistakes (a module
    # left out of the wheel, a dependency missing from the metadata) that
    # the tests, which run from the source tree, can't see.
    name: package
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Smoke-test the wheel and the sdist
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home" TACK_CONFIG="$RUNNER_TEMP/no-config"
          mkdir -p "$HOME"
          git init -q "$RUNNER_TEMP/demo"
          for dist in dist/*.whl dist/*.tar.gz; do
            env="$RUNNER_TEMP/venv-$(basename "$dist")"
            uv venv -q "$env"
            uv pip install -q --python "$env" "$dist"
            "$env/bin/tack" --version
            "$env/bin/tack" doctor --json "$RUNNER_TEMP/demo" | "$env/bin/python" -c \
              'import json, sys; assert json.load(sys.stdin)["projects"] == [sys.argv[1]]' \
              "$RUNNER_TEMP/demo"
          done

  ok:
    # The one check branch protection requires, so the matrix can change
    # without editing the protection rule. A docs-only pull request skips the
    # checks and passes; anything else must pass all of them.
    # Its script exits explicitly: bash ignores -e inside an && list (#84).
    name: CI passed
    if: always()
    needs: [changes, lint, test, package]
    runs-on: ubuntu-latest
    steps:
      - env:
          CODE: ${{ needs.changes.outputs.code }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          for result in "$LINT" "$TEST" "$PACKAGE"; do
            case "$result" in
              success) ;;
              skipped) test "$CODE" = false || exit 1 ;;
              *) exit 1 ;;
            esac
          done
