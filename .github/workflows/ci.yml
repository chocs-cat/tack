name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  changes:
    # Decides whether the checks run. The path filter lives here, not in a
    # workflow-level paths-ignore: a skipped workflow never reports `CI
    # passed`, so a pull request it skips would wait on it forever.
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          # Paths nothing in the checks or the build reads, as an extended
          # regex: a pull request that touches only these skips the checks.
          # Never list this workflow, which tests/test_ci.py reads and a change
          # must prove. docs/design.md stays out too: tests/test_config.py
          # loads its manifest example.
          SKIP: '^(docs/(decisions\.md|logo-(dark|light)\.svg)$|AGENTS\.md$|CLAUDE\.md$|CONTRIBUTING\.md$|CHANGELOG\.md$|\.agents/repokit\.toml$|\.github/dependabot\.yml$|\.github/workflows/(formula|pr-title|release)\.yml$|\.release-please-manifest\.json$|release-please-config\.json$)'
        run: |
          if [ -z "$PR" ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Both sides of a rename count, so moving code into docs/ still runs.
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)')
          if grep -qvE "$SKIP" <<<"$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint (ruff, ty)
    needs: changes
    # Anything but an explicit `false` runs it, so a failed `changes` job
    # still runs the checks instead of skipping them.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q

  package:
    # Build the sdist and wheel, then install each into a fresh environment
    # and run the installed command: catches packaging mistakes (a module
    # left out of the wheel, a dependency missing from the metadata) that
    # the tests, which run from the source tree, can't see.
    name: package
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Smoke-test the wheel and the sdist
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home" TACK_CONFIG="$RUNNER_TEMP/no-config"
          mkdir -p "$HOME"
          git init -q "$RUNNER_TEMP/demo"
          for dist in dist/*.whl dist/*.tar.gz; do
            env="$RUNNER_TEMP/venv-$(basename "$dist")"
            uv venv -q "$env"
            uv pip install -q --python "$env" "$dist"
            "$env/bin/tack" --version
            "$env/bin/tack" doctor --json "$RUNNER_TEMP/demo" | "$env/bin/python" -c \
              'import json, sys; assert json.load(sys.stdin)["projects"] == [sys.argv[1]]' \
              "$RUNNER_TEMP/demo"
          done

  ok:
    # The one check branch protection requires, so the matrix can change
    # without editing the protection rule. Rename it only together with the
    # protection rule.
    name: CI passed
    # Without always(), a failed check skips this job, and a skipped job
    # reports success.
    if: always()
    # Every job that must pass, plus `changes`. Leave out jobs that run on
    # some events only: one skipped on a push would fail this.
    needs: [changes, lint, test, package]
    runs-on: ubuntu-latest
    steps:
      # Passes only if every job in `needs` but `changes` succeeded, or was
      # skipped on a pull request `changes` found docs-only. jq judges all
      # the results in one expression and `-e` turns false into exit 1, so a
      # job added to `needs` is covered with no other edit. Don't rewrite it
      # as a shell loop of `test … || …`: under `bash -e` only the last
      # iteration's status counts, so an earlier failure passes (#84).
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e '(.changes.outputs.code == "false") as $docs
            | del(.changes)
            | all(.[]; .result == "success" or ($docs and .result == "skipped"))' \
            <<<"$NEEDS" >/dev/null
