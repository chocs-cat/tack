name: Release

# release-please keeps a release PR open that bumps the version and updates
# CHANGELOG.md from Conventional Commits. Merging it tags vX.Y.Z and creates
# the GitHub release; then `publish` uploads the package to PyPI by trusted
# publishing (no token), and `formula` updates the Homebrew tap. The one-time
# setup is in CONTRIBUTING.md.

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          # A PR opened with the built-in GITHUB_TOKEN waits for a maintainer
          # to approve its CI run. RELEASE_PLEASE_TOKEN (a fine-grained PAT:
          # this repo, Contents and Pull requests read/write) avoids that;
          # until it is set this falls back to GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Attach the dists to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/*

  formula:
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/formula.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    secrets: inherit
